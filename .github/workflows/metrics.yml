name: GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # READ token (recommended: fine-grained PAT with access to your repos)
          token: ${{ secrets.METRICS_TOKEN }}

          # WRITE token (use built-in token to commit the svg)
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: update metrics"

          user: alysolamon
          template: classic
          filename: github-metrics.svg

          # IMPORTANT: removes the header entirely (no joined date, no followers)
          base: ""

          # Languages block
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: mdx, html, css

          # Tech/topics block (this is how you surface PyTorch/NumPy/etc)
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 12
          plugin_topics_sort: stars

          # Optional: widen layout a bit
          config_display: large
          config_animations: yes
