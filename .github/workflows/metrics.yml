name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    # daily at 06:10 Toronto time-ish (cron is UTC; adjust if you care)
    - cron: "10 11 * * *"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Languages card (clean, no header/followers/join date)
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}

          user: alysolamon
          template: classic
          base: ""
          config_timezone: America/Toronto

          filename: github-languages.svg
          output_action: commit

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size,percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: no

          # IMPORTANT: removes the empty "Mastered technologies and topics"
          plugin_topics: no

      # 2) Activity card (same “clean” approach)
      - name: Generate activity card
        uses: lowlighter/metrics@v3.34.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}

          user: alysolamon
          template: classic
          base: ""
          config_timezone: America/Toronto

          filename: github-activity.svg
          output_action: commit

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
