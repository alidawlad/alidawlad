name: metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Reads your private/org repos for accurate language stats (PAT)
          token: ${{ secrets.METRICS_TOKEN }}

          # Commits the generated SVG back to your repo (safe + reliable)
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main

          # Output file name (this will be committed at repo root)
          filename: github-metrics.svg

          # Core layout (this is the “nice card”)
          template: classic
          base: header, activity

          # Repo coverage
          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          # Languages bar
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: mdx, html, css

          # Optional: if you hate the label "Jupyter Notebook", rename it
          # plugin_languages_aliases: "Jupyter Notebook:Python (notebooks)"

          # Remove “Joined GitHub …” and “Followed by …”
          # Rename “Languages” headings
          extras_js: |
            // Remove header lines containing specific text
            const removeLineByText = (needle) => {
              const nodes = [...document.querySelectorAll("*")]
                .filter(n => (n.textContent || "").includes(needle));
              for (const n of nodes) {
                const line = n.closest(".field, .metadata, .row, li, p, div") || n;
                // Only remove small “line-like” containers (avoid nuking big sections)
                if ((line.textContent || "").length < 120) line.remove();
              }
            };
            removeLineByText("Joined GitHub");
            removeLineByText("Followed by");

            // Rename section headers safely
            for (const h of document.querySelectorAll("h2,h3")) {
              const t = (h.textContent || "").trim();
              if (t === "Languages") h.textContent = "Programming languages";
            }

            // Rename “Most used languages” label (only leaf nodes to avoid wiping children)
            for (const el of document.querySelectorAll("span,div,p")) {
              if (el.children.length === 0) {
                const t = (el.textContent || "").trim();
                if (t === "Most used languages") el.textContent = "Most used programming languages";
              }
            }
