name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Compact: languages + (optional) topics/tech
      - name: Metrics (languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-languages.svg

          # IMPORTANT: no header/community = no joined date, no followers
          base: ""

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Optional: if you want the “Mastered technologies and topics” line
          # plugin_topics: yes
          # plugin_topics_mode: mastered
          # plugin_topics_limit: 12

          config_timezone: America/Toronto

      # 2) Bigger: activity snapshot (move lower in README)
      - name: Metrics (activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-activity.svg

          # Only activity (no header/community => hides join/followers)
          base: activity
          base_indepth: yes

          config_timezone: America/Toronto
