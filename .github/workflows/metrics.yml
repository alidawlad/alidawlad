name: metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Use your PAT so private/org repos can count toward languages
          token: ${{ secrets.METRICS_TOKEN }}

          # Commit the generated SVG using the workflow token
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main

          # Output file saved at repo root
          filename: github-metrics.svg

          # TEMPLATE + CONTENT
          template: classic

          # ✅ NO HEADER → removes Joined + Followers automatically
          base: activity

          # Repo coverage (for better language accuracy)
          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: mdx, html, css

          # Optional: if you want “Jupyter Notebook” to read nicer:
          # plugin_languages_aliases: "Jupyter Notebook:Python (notebooks)"
